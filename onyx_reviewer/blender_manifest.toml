schema_version = "1.0.0"

id = "onyx_reviewer"
version = "0.15.1"
name = "Onyx Reviewer"
tagline = "Inspect topology and mesh health without changing the asset"
maintainer = "Onyx"
type = "add-on"

tags = ["3D View", "Mesh", "Modeling"]
blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
clipboard = "Copy review reports and comparisons"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    ".*",
    "/*.zip",
    "*.blend[1-9]",
    "/docs/",
    "/README.md",
    "/CHANGELOG.md",
]
