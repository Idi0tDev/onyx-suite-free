name: Public Source Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit public source
        shell: pwsh
        run: ./tools/check_public_source.ps1
      - name: Synchronize embedded Core
        shell: pwsh
        run: ./tools/sync_embedded_core.ps1
      - name: Validate extension manifests
        run: python tests/extension_manifest_test.py
      - name: Run framework tests
        run: python tests/core_framework_test.py
      - name: Run Reviewer model tests
        run: python tests/reviewer_analysis_test.py
      - name: Run Reviewer profile tests
        run: python tests/reviewer_profiles_test.py
      - name: Verify embedded Core
        run: python tests/core_reviewer_embedding_test.py

  package:
    needs: pure-python
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download Blender 5.2 LTS
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "blender-5.2.0-windows-x64.zip"
          $install = Join-Path $env:RUNNER_TEMP "blender-5.2.0"
          Invoke-WebRequest `
            -Uri "https://download.blender.org/release/Blender5.2/blender-5.2.0-windows-x64.zip" `
            -OutFile $download
          Expand-Archive -LiteralPath $download -DestinationPath $install
          $blender = Get-ChildItem -LiteralPath $install -Filter blender.exe -File -Recurse |
            Select-Object -First 1
          if (-not $blender) { throw "Blender executable was not found after extraction." }
          "BLENDER_PATH=$($blender.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build verified release candidate
        shell: pwsh
        run: ./tools/build_release.ps1 -BlenderPath $env:BLENDER_PATH
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: onyx-suite-free-release-candidate
          path: |
            dist/onyx_*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
