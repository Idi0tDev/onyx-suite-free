name: Public Source Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit public source
        shell: pwsh
        run: ./tools/check_public_source.ps1
      - name: Synchronize embedded Core
        shell: pwsh
        run: ./tools/sync_embedded_core.ps1
      - name: Run framework tests
        run: python tests/core_framework_test.py
      - name: Run review model tests
        run: python tests/review_analysis_test.py
      - name: Verify embedded Core
        run: python tests/core_review_embedding_test.py

  package:
    needs: pure-python
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build verified release candidate
        shell: pwsh
        run: ./tools/build_release.ps1
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: onyx-suite-free-release-candidate
          path: |
            dist/onyx_core-*.zip
            dist/onyx_review-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
