name: Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate extension manifests
        run: python tests/extension_manifest_test.py
      - name: Verify suite release tag
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH."
          }
          "ONYX_SUITE_VERSION=$tagVersion" >> $env:GITHUB_ENV
      - name: Download Blender 5.2 LTS
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP "blender-5.2.0-windows-x64.zip"
          $install = Join-Path $env:RUNNER_TEMP "blender-5.2.0"
          Invoke-WebRequest `
            -Uri "https://download.blender.org/release/Blender5.2/blender-5.2.0-windows-x64.zip" `
            -OutFile $download
          Expand-Archive -LiteralPath $download -DestinationPath $install
          $blender = Get-ChildItem -LiteralPath $install -Filter blender.exe -File -Recurse |
            Select-Object -First 1
          if (-not $blender) { throw "Blender executable was not found after extraction." }
          "BLENDER_PATH=$($blender.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build verified release bundle
        shell: pwsh
        run: ./tools/build_release.ps1 -BlenderPath $env:BLENDER_PATH
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $productIds = @(Get-Content tools/public_products.txt | ForEach-Object {
            $_.Trim()
          } | Where-Object {
            $_ -and -not $_.StartsWith("#")
          })
          $assets = @($productIds | ForEach-Object {
            $manifest = Get-Content "$_/blender_manifest.toml" -Raw
            $name = [regex]::Match($manifest, '(?m)^name\s*=\s*"([^"]+)"\s*$').Groups[1].Value
            $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^"]+)"\s*$').Groups[1].Value
            $path = "dist/$_-$version.zip"
            if (-not $name -or -not $version -or -not (Test-Path -LiteralPath $path)) {
              throw "Release asset metadata is incomplete for $_."
            }
            "$path#$name $version"
          })
          $assets += "dist/SHA256SUMS.txt#SHA-256 checksums"
          & gh release create "${{ github.ref_name }}" @assets `
            --draft `
            --generate-notes `
            --verify-tag `
            --title "Onyx Suite Free $env:ONYX_SUITE_VERSION"
